<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API-Wireframe</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h3 mb-4">API-Wireframe</h1>

      <div class="row g-3">
        <section class="col-12 col-md-6">
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <h2 class="h5">Katzenbild</h2>
              <div id="cat-result" class="image-placeholder bg-body-tertiary border mb-3" aria-label="Bild-Platzhalter"></div>
              <button id="load-cat" class="btn btn-outline-secondary mt-auto" type="button">Bild laden</button>
            </div>
          </div>
        </section>

        <section class="col-12 col-sm-6 col-md-3">
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <h2 class="h5 mb-3">Bitcoin</h2>
              <dl id="bitcoin-result" aria-live="polite">
                <dt>USD</dt>
                <dd id="bitcoin-usd">—</dd>
                <dt>CHF</dt>
                <dd id="bitcoin-chf">—</dd>
              </dl>
              <button id="load-bitcoin" class="btn btn-outline-secondary mt-auto" type="button">Preis laden</button>
            </div>
          </div>
        </section>

        <section class="col-12 col-sm-6 col-md-3">
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <h2 class="h5 mb-3">Wetter</h2>
              <div id="weather-result" aria-live="polite" data-latitude="47.3769" data-longitude="8.5417">
                <p>Zürich</p>
                <p id="weather-temperature" class="h3 mb-3">— °C</p>
              </div>
              <button id="load-weather" class="btn btn-outline-secondary mt-auto" type="button">Wetter laden</button>
            </div>
          </div>
        </section>

        <section class="col-12 col-md-6">
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <h2 class="h5 mb-3">Ladestationen in Zürich</h2>
              <ol id="stations-result" aria-live="polite" class="list-group list-group-numbered list-group-flush mb-3" data-latitude="47.3769" data-longitude="8.5417">
                <li class="list-group-item">—</li>
                <li class="list-group-item">—</li>
                <li class="list-group-item">—</li>
                <li class="list-group-item">—</li>
                <li class="list-group-item">—</li>
              </ol>
              <button id="load-stations" class="btn btn-outline-secondary mt-auto" type="button">Stationen laden</button>
            </div>
          </div>
        </section>

        <section class="col-12 col-md-6">
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <h2 class="h5 mb-3">Karte</h2>
              <div id="map-result" class="map-placeholder bg-body-tertiary border d-flex align-items-center justify-content-center mb-3" data-latitude="47.3769" data-longitude="8.5417">Zürich</div>
              <button id="load-map" class="btn btn-outline-secondary mt-auto" type="button">Karte laden</button>
            </div>
          </div>
        </section>
      </div>
      <footer class="small text-secondary mt-3">Daten: <a href="https://thecatapi.com/">The Cat API</a> · <a href="https://www.coinbase.com/">Coinbase</a> · <a href="https://open-meteo.com/">Open-Meteo</a> · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · <a href="https://www.swisstopo.admin.ch/">swisstopo</a></footer>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
